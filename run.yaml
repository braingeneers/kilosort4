apiVersion: batch/v1
kind: Job
metadata:
  name: kilosort4-job
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:  # The following all have 24Gb+ RAM; adjust from the list here: https://nrp.ai/documentation/userdocs/running/gpu-pods/
                - Quadro-RTX-8000
                - Tesla-V100-SXM2-32GB
                - NVIDIA-A40
                - NVIDIA-L40
                - NVIDIA-RTX-A6000
      containers:
        - name: kilosort4-container
          image: quay.io/opbrahme/kilobuild:latest
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - >
              python3 /tmp/run.py s3://braingeneers/ephys/2025-05-27-e-KOLF2.2J_SmitsMidbrain/original/data/23126c_D44_KOLFMO_5272025.raw.h5
          volumeMounts:
            - name: prp-s3-credentials
              mountPath: "/root/.aws/credentials"
              subPath: "credentials"
            - name: prp-s3-credentials
              mountPath: "/root/.aws/.s3cfg"
              subPath: ".s3cfg"
            - name: kube-config
              mountPath: "/root/.kube"
          resources:
            requests:
              nvidia.com/gpu: 1
              cpu: 1
              memory: 32Gi
            limits:
              nvidia.com/gpu: 1
              cpu: 12  # Throttle the container if using more CPU
              memory: 64Gi  # Terminate the container if using more memory
      volumes:
        - name: prp-s3-credentials
          secret:
            secretName: prp-s3-credentials
        - name: kube-config
          secret:
            secretName: kube-config
      restartPolicy: Never
  backoffLimit: 0  # k8 will reissue this Job this number of times if it fails (even if you kill it manually)
